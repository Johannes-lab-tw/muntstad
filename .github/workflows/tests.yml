# Unit + e2e tests in the cloud on every push (three iPad profiles in parallel); the site deploys to GitHub Pages
# only after all three are green (PLAN-V6 §E). A newer push cancels an older test run.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # 38 e2e-tests op de trage runner (~1 fps eiland) duren 40-50 minuten per profiel
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-ipad-gen7, chromium-ipad-mini, chromium-ipad-pro11]
        # two groups per profile, one worker each: the island renders at about a frame per second on the runner
        group:
          - { name: dorp, specs: 'tests/e2e/audits.spec.js tests/e2e/dorp.spec.js tests/e2e/live.spec.js tests/e2e/offline.spec.js tests/e2e/papa.spec.js tests/e2e/persistence.spec.js tests/e2e/playthrough.spec.js tests/e2e/pwa.spec.js tests/e2e/smoke.spec.js' }
          - { name: eiland, specs: 'tests/e2e/avontuur.spec.js tests/e2e/eiland-doen.spec.js tests/e2e/eiland-nacht.spec.js tests/e2e/eiland-ketens.spec.js tests/e2e/campagne.spec.js tests/e2e/samen.spec.js' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=${{ matrix.project }} ${{ matrix.group.specs }}
        env:
          PW_WORKERS: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.group.name }}
          path: playwright-report/
          retention-days: 7
  deploy:
    # docs/ goes live only when every profile passed; Settings → Pages → Source must be "GitHub Actions"
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
